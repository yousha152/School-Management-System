<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand">
                <span class="logo">SM</span>
                <h2>School Manager</h2>
            </div>
            <nav class="nav-menu">
                <button class="nav-btn active" data-tab="dashboard">Dashboard</button>
                <button class="nav-btn" data-tab="students">Students</button>
                <button class="nav-btn" data-tab="teachers">Teachers</button>
                <button class="nav-btn" data-tab="attendance">Attendance</button>
                <button class="nav-btn" data-tab="marks">Marks & Grades</button>
                <button class="nav-btn" data-tab="fees">Fees</button>
            </nav>
        </aside>

        <main class="content">
            <header class="topbar">
                <h1 id="pageTitle">Dashboard Overview</h1>
                <div class="user-badge">Admin Portal</div>
            </header>

            <!-- Dashboard -->
            <section id="dashboard" class="tab-content active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Students</h3>
                        <p class="stat-val" id="totalStudentsCount">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Teachers</h3>
                        <p class="stat-val" id="totalTeachersCount">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Pending Fees</h3>
                        <p class="stat-val" id="totalPendingFees">Rs. 0</p>
                    </div>
                </div>
            </section>

            <!-- Students -->
            <section id="students" class="tab-content">
                <div class="panel-grid">
                    <form id="studentForm" class="card-form">
                        <h3>Add Student</h3>
                        <input type="text" id="stId" placeholder="Student ID (ST101)" required>
                        <input type="text" id="stName" placeholder="Full Name" required>
                        <input type="number" id="stAge" placeholder="Age" required>
                        <select id="stGender">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                        <input type="text" id="stClass" placeholder="Class" required>
                        <input type="text" id="stSection" placeholder="Section" required>
                        <input type="text" id="stFather" placeholder="Father's Name" required>
                        <input type="text" id="stContact" placeholder="Contact Number" required>
                        <button type="submit" class="btn">Register Student</button>
                    </form>

                    <div class="card-table">
                        <h3>Student Records</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Class</th>
                                    <th>Section</th>
                                    <th>Contact</th>
                                </tr>
                            </thead>
                            <tbody id="studentTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- Teachers -->
            <section id="teachers" class="tab-content">
                <div class="panel-grid">
                    <form id="teacherForm" class="card-form">
                        <h3>Add Teacher</h3>
                        <input type="text" id="tId" placeholder="Teacher ID (T101)" required>
                        <input type="text" id="tName" placeholder="Full Name" required>
                        <input type="text" id="tSubject" placeholder="Subject" required>
                        <input type="text" id="tQual" placeholder="Qualification" required>
                        <input type="number" id="tExp" placeholder="Experience (Years)" required>
                        <input type="text" id="tContact" placeholder="Contact Number" required>
                        <input type="text" id="tClass" placeholder="Assigned Class" required>
                        <button type="submit" class="btn">Add Faculty</button>
                    </form>

                    <div class="card-table">
                        <h3>Faculty Records</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Subject</th>
                                    <th>Class</th>
                                    <th>Contact</th>
                                </tr>
                            </thead>
                            <tbody id="teacherTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- Attendance -->
            <section id="attendance" class="tab-content">
                <form id="attendanceForm" class="card-form narrow">
                    <h3>Mark Attendance</h3>
                    <select id="attStudentSelect" required></select>
                    <select id="attStatus">
                        <option value="P">Present</option>
                        <option value="A">Absent</option>
                        <option value="L">Leave</option>
                    </select>
                    <button type="submit" class="btn">Submit Attendance</button>
                </form>
            </section>

            <!-- Marks -->
            <section id="marks" class="tab-content">
                <form id="marksForm" class="card-form narrow">
                    <h3>Academic Marks Entry</h3>
                    <select id="marksStudentSelect" required></select>
                    <input type="number" id="mEng" placeholder="English (0-100)" min="0" max="100" required>
                    <input type="number" id="mMath" placeholder="Mathematics (0-100)" min="0" max="100" required>
                    <input type="number" id="mPhy" placeholder="Physics (0-100)" min="0" max="100" required>
                    <input type="number" id="mChem" placeholder="Chemistry (0-100)" min="0" max="100" required>
                    <input type="number" id="mComp" placeholder="Computer (0-100)" min="0" max="100" required>
                    <button type="submit" class="btn">Calculate & Save Marks</button>
                </form>
            </section>

            <!-- Fees -->
            <section id="fees" class="tab-content">
                <form id="feeForm" class="card-form narrow">
                    <h3>Fee Management</h3>
                    <select id="feeStudentSelect" required></select>
                    <input type="number" id="feeMonthly" placeholder="Monthly Fee (Rs.)" required>
                    <input type="number" id="feePaid" placeholder="Paid Amount (Rs.)" required>
                    <button type="submit" class="btn">Process Payment</button>
                </form>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
